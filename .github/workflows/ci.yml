name: CI — Build & Push

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      go:                   ${{ steps.filter.outputs.go }}
      bun:                  ${{ steps.filter.outputs.bun }}
      auth-service:         ${{ steps.filter.outputs.auth-service }}
      product-service:      ${{ steps.filter.outputs.product-service }}
      order-service:        ${{ steps.filter.outputs.order-service }}
      payment-service:      ${{ steps.filter.outputs.payment-service }}
      shipping-service:     ${{ steps.filter.outputs.shipping-service }}
      inventory-service:    ${{ steps.filter.outputs.inventory-service }}
      rating-service:       ${{ steps.filter.outputs.rating-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      media-service:        ${{ steps.filter.outputs.media-service }}
      search-service:       ${{ steps.filter.outputs.search-service }}
      promotion-service:    ${{ steps.filter.outputs.promotion-service }}
      frontend:             ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'services/shared/**'
              - 'services/auth-service/**'
              - 'services/product-service/**'
              - 'services/order-service/**'
              - 'services/payment-service/**'
              - 'services/shipping-service/**'
              - 'services/inventory-service/**'
              - 'services/search-service/**'
              - 'go.work'
              - 'go.work.sum'
            bun:
              - 'services/rating-service/**'
              - 'services/notification-service/**'
              - 'services/media-service/**'
              - 'services/promotion-service/**'
            auth-service:
              - 'services/auth-service/**'
              - 'services/shared/**'
              - 'go.work'
              - 'go.work.sum'
            product-service:
              - 'services/product-service/**'
              - 'services/shared/**'
              - 'go.work'
              - 'go.work.sum'
            order-service:
              - 'services/order-service/**'
              - 'services/shared/**'
              - 'go.work'
              - 'go.work.sum'
            payment-service:
              - 'services/payment-service/**'
              - 'services/shared/**'
              - 'go.work'
              - 'go.work.sum'
            shipping-service:
              - 'services/shipping-service/**'
              - 'services/shared/**'
              - 'go.work'
              - 'go.work.sum'
            inventory-service:
              - 'services/inventory-service/**'
              - 'services/shared/**'
              - 'go.work'
              - 'go.work.sum'
            search-service:
              - 'services/search-service/**'
              - 'services/shared/**'
              - 'go.work'
              - 'go.work.sum'
            rating-service:
              - 'services/rating-service/**'
            notification-service:
              - 'services/notification-service/**'
            media-service:
              - 'services/media-service/**'
            promotion-service:
              - 'services/promotion-service/**'
            frontend:
              - 'frontend/**'

  # Go workspace — format, build, vet & test every module
  go-check:
    name: Go — gofmt, build, vet, test
    needs: [detect-changes]
    if: needs.detect-changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/*/go.sum
            go.work.sum
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l services)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build, vet & test all Go modules
        run: |
          MODULES="services/shared services/auth-service services/product-service services/order-service services/payment-service services/inventory-service services/shipping-service services/search-service"
          for module in $MODULES; do
            echo "==> $module"
            (cd "$module" && go build ./... && go vet ./... && go test ./...) || exit 1
          done

  # Bun services — install & test (matrix)
  bun-check:
    name: Bun — install & test (${{ matrix.service }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.bun == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [rating-service, notification-service, media-service, promotion-service]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install & test
        working-directory: services/${{ matrix.service }}
        run: |
          bun install --frozen-lockfile
          bun test

  frontend-check:
    name: Frontend — check, lint, test
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install workspace dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Type check (svelte-check + tsc)
        working-directory: frontend
        run: bun run check
      - name: Lint & format check
        working-directory: frontend
        run: bun run lint
      - name: Locale catalogue parity
        working-directory: frontend
        run: bun run i18n:check
      - name: Unit tests
        working-directory: frontend
        run: bun test

  # Build & Push — Go services
  build-auth-service:
    name: Build — auth-service
    needs: [detect-changes, go-check]
    if: |
      (needs.detect-changes.outputs.auth-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.go-check.result == 'success' || needs.go-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: auth-service
      context: services
      dockerfile: services/auth-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-product-service:
    name: Build — product-service
    needs: [detect-changes, go-check]
    if: |
      (needs.detect-changes.outputs.product-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.go-check.result == 'success' || needs.go-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: product-service
      context: services
      dockerfile: services/product-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-order-service:
    name: Build — order-service
    needs: [detect-changes, go-check]
    if: |
      (needs.detect-changes.outputs.order-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.go-check.result == 'success' || needs.go-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: order-service
      context: services
      dockerfile: services/order-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-payment-service:
    name: Build — payment-service
    needs: [detect-changes, go-check]
    if: |
      (needs.detect-changes.outputs.payment-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.go-check.result == 'success' || needs.go-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: payment-service
      context: services
      dockerfile: services/payment-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-shipping-service:
    name: Build — shipping-service
    needs: [detect-changes, go-check]
    if: |
      (needs.detect-changes.outputs.shipping-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.go-check.result == 'success' || needs.go-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: shipping-service
      context: services
      dockerfile: services/shipping-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-inventory-service:
    name: Build — inventory-service
    needs: [detect-changes, go-check]
    if: |
      (needs.detect-changes.outputs.inventory-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.go-check.result == 'success' || needs.go-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: inventory-service
      context: services
      dockerfile: services/inventory-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-search-service:
    name: Build — search-service
    needs: [detect-changes, go-check]
    if: |
      (needs.detect-changes.outputs.search-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.go-check.result == 'success' || needs.go-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: search-service
      context: services
      dockerfile: services/search-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build & Push — Bun services
  build-rating-service:
    name: Build — rating-service
    needs: [detect-changes, bun-check]
    if: |
      (needs.detect-changes.outputs.rating-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.bun-check.result == 'success' || needs.bun-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: rating-service
      context: services/rating-service
      dockerfile: services/rating-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-notification-service:
    name: Build — notification-service
    needs: [detect-changes, bun-check]
    if: |
      (needs.detect-changes.outputs.notification-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.bun-check.result == 'success' || needs.bun-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: notification-service
      context: services/notification-service
      dockerfile: services/notification-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-media-service:
    name: Build — media-service
    needs: [detect-changes, bun-check]
    if: |
      (needs.detect-changes.outputs.media-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.bun-check.result == 'success' || needs.bun-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: media-service
      context: services/media-service
      dockerfile: services/media-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-promotion-service:
    name: Build — promotion-service
    needs: [detect-changes, bun-check]
    if: |
      (needs.detect-changes.outputs.promotion-service == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.bun-check.result == 'success' || needs.bun-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: promotion-service
      context: services/promotion-service
      dockerfile: services/promotion-service/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build & Push — SvelteKit frontends (context = Bun workspace root)
  build-frontend-web:
    name: Build — frontend-web (storefront)
    needs: [detect-changes, frontend-check]
    if: |
      (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.frontend-check.result == 'success' || needs.frontend-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: frontend-web
      context: frontend
      dockerfile: frontend/apps/web/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend-admin:
    name: Build — frontend-admin (dashboard)
    needs: [detect-changes, frontend-check]
    if: |
      (needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.frontend-check.result == 'success' || needs.frontend-check.result == 'skipped')
    uses: ./.github/workflows/_build-service.yml
    with:
      service: frontend-admin
      context: frontend
      dockerfile: frontend/apps/admin/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Summary gate
  ci-success:
    name: CI Passed
    if: always()
    needs:
      - go-check
      - bun-check
      - frontend-check
      - build-auth-service
      - build-product-service
      - build-order-service
      - build-payment-service
      - build-shipping-service
      - build-inventory-service
      - build-rating-service
      - build-notification-service
      - build-media-service
      - build-search-service
      - build-promotion-service
      - build-frontend-web
      - build-frontend-admin
    runs-on: ubuntu-latest
    steps:
      - name: Check all builds passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All jobs passed"
