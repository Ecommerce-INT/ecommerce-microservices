components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak (realm `ecommerce`), verify bởi APISIX `openid-connect` (`bearer_only`, JWKS, RS256).
        Không kiểm role (ISSUE-01); promotion-service không đọc token.
  responses:
    GatewayUnauthorized:
      description: |
        APISIX `openid-connect` từ chối (thiếu/sai/hết hạn token). Header `WWW-Authenticate: Bearer realm="ecommerce"`;
        body do APISIX/OpenResty sinh, không phải định dạng của service.
    GatewayRateLimited:
      description: 'APISIX `limit-count` (1200 req/60 s theo `remote_addr`, `rejected_code: 429`) — body mặc định APISIX (ISSUE-61).'
    GatewayUpstreamMissing:
      description: |
        Route khớp nhưng `upstream_id: 13` không được định nghĩa (ISSUE-13) → APISIX trả lỗi 5xx
        (theo mã nguồn APISIX là 502 — chưa kiểm chứng runtime).
    PromotionInvalidId:
      description: '`promotionId` không phải số.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BunStatusError" }
          example: { statusCode: "400", message: Invalid ID }
    PromotionValidationError:
      description: Body không qua Zod `PromotionPostVmSchema` / `PromotionPutVmSchema`; `errors` là mảng issue Zod v4.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BunValidationError" }
          example:
            statusCode: "400"
            message: Validation error
            errors:
              - { expected: string, code: invalid_type, path: [name], message: "Invalid input: expected string, received undefined" }
    PromotionInternalError:
      description: |
        Exception trong handler promotion (body không phải JSON, lỗi DB, ngày không hợp lệ, id không tồn tại khi PUT…);
        `message` = `err.message` nguyên văn (ISSUE-93).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BunStatusError" }
          example: { statusCode: "500", message: "JSON Parse error: Unexpected identifier \"abc\"" }
    HonoInternalError:
      description: |
        Exception không bắt trong route tax → handler lỗi mặc định của Hono (`app.onError` không cấu hình) (ISSUE-94).
      content:
        text/plain:
          schema: { type: string, const: Internal Server Error }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, const: UP }
        components:
          type: object
          properties:
            db:
              type: object
              properties:
                status: { type: string, const: UP }
    BunStatusError:
      type: object
      description: Định dạng lỗi route promotion (`src/index.ts:66,74,77`). `statusCode` là **chuỗi**.
      required: [statusCode, message]
      properties:
        statusCode: { type: string, examples: ["400", "404", "500"] }
        message: { type: string }
    BunValidationError:
      allOf:
        - $ref: "#/components/schemas/BunStatusError"
        - type: object
          properties:
            errors:
              type: array
              description: Mảng `ZodIssue` (Zod v4) — `code`, `path`, `message`, và các field tùy loại issue.
              items:
                type: object
                properties:
                  code: { type: string }
                  path: { type: array, items: { type: [string, integer] } }
                  message: { type: string }
                additionalProperties: true
    MessageError:
      type: object
      description: Định dạng lỗi route tax (`src/index.ts:141-251`).
      required: [message]
      properties:
        message: { type: string }
    PromotionPostVm:
      type: object
      description: Zod `PromotionPostVmSchema` (`src/types.ts:3-17`). Field enum là chuỗi tự do (ISSUE-30).
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, description: "Rỗng → sinh từ `name`." }
        description: { type: string, default: "" }
        couponCode: { type: string, default: "" }
        usageLimit: { type: integer, default: 100 }
        discountType: { type: string, default: PERCENTAGE }
        applyTo: { type: string, default: ALL }
        usageType: { type: string, default: UNLIMITED }
        discountPercentage: { type: integer, default: 0, description: "Không giới hạn 0–100 (ISSUE-62)." }
        discountAmount: { type: integer, default: 0, description: "Có thể âm (ISSUE-62)." }
        isActive: { type: boolean, default: true }
        startDate: { type: string, description: "Chuỗi bất kỳ được `new Date()` parse; không validate định dạng." }
        endDate: { type: string }
    PromotionPutVm:
      allOf:
        - $ref: "#/components/schemas/PromotionPostVm"
        - type: object
          required: [id]
          properties:
            id: { type: integer }
    PromotionDetailVm:
      type: object
      description: "`mapRow` (`src/service.ts:6-28`). `brands`/`categories`/`products` luôn `[]`."
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        couponCode: { type: string }
        usageLimit: { type: integer }
        usageCount: { type: integer, description: "Không bao giờ tăng (ISSUE-30)." }
        discountType: { type: string }
        applyTo: { type: string }
        usageType: { type: string }
        discountPercentage: { type: integer }
        discountAmount: { type: integer }
        isActive: { type: boolean }
        startDate: { type: [string, "null"], format: date-time }
        endDate: { type: [string, "null"], format: date-time }
        brands: { type: array, items: {}, maxItems: 0 }
        categories: { type: array, items: {}, maxItems: 0 }
        products: { type: array, items: {}, maxItems: 0 }
    PromotionListVm:
      type: object
      properties:
        promotionDetailVmList:
          type: array
          items: { $ref: "#/components/schemas/PromotionDetailVm" }
        totalElements: { type: integer }
        totalPages: { type: integer }
    TaxClassPostVm:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: "UNIQUE trong DB; trùng → 500." }
    TaxClassVm:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    TaxClassListVm:
      type: object
      properties:
        taxClasses:
          type: array
          items: { $ref: "#/components/schemas/TaxClassVm" }
        pageNo: { type: integer }
        pageSize: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: [integer, "null"], description: "`null` khi `pageSize=0` (NaN/Infinity)." }
        isLast: { type: boolean }
    TaxRatePostVm:
      type: object
      description: Zod `TaxRatePostVmSchema` (`src/tax-types.ts:23-29`).
      required: [rate, countryId, taxClassId]
      properties:
        rate: { type: number, description: "Lưu `NUMERIC(10,4)`; không chặn âm (ISSUE-62)." }
        countryId: { type: integer }
        stateOrProvinceId: { type: [integer, "null"] }
        zipCode: { type: [string, "null"] }
        taxClassId: { type: integer, description: "FK `tax_class.id`; không tồn tại → 500." }
    TaxRateVm:
      type: object
      properties:
        id: { type: integer }
        rate: { type: number }
        countryId: { type: integer }
        stateOrProvinceId: { type: [integer, "null"] }
        zipCode: { type: [string, "null"] }
        taxClassId: { type: integer, description: "`0` nếu cột NULL." }
        taxClassName: { type: [string, "null"], description: "Không có trong response POST." }
    TaxRateListVm:
      type: object
      properties:
        taxRates:
          type: array
          items: { $ref: "#/components/schemas/TaxRateVm" }
        pageNo: { type: integer }
        pageSize: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: [integer, "null"] }
        isLast: { type: boolean }
