components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak (realm `ecommerce`), verify bởi APISIX `openid-connect` (`bearer_only`, JWKS, RS256).
        Không kiểm role (ISSUE-01); service không tự verify (ISSUE-02).
  responses:
    GatewayUnauthorized:
      description: APISIX `openid-connect` từ chối (thiếu/sai/hết hạn token). Body do APISIX sinh, không phải `ErrorVm`.
    BadRequestBody:
      description: '"Invalid request body" — body không phải JSON hợp lệ / sai kiểu.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorVm" }
          example: { statusCode: "400", title: Bad request, detail: Invalid request body }
    BadRequestPayload:
      description: '"Invalid request payload" — body không phải JSON hợp lệ / sai kiểu.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorVm" }
          example: { statusCode: "400", title: Bad request, detail: Invalid request payload }
    BadRequestId:
      description: 'Path id không phải số nguyên ("Invalid categoryId" / "Invalid productId").'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorVm" }
    FavouriteNotFound:
      description: '"Favourite not found".'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorVm" }
          example: { statusCode: "404", title: Not found, detail: Favourite not found }
    InternalError:
      description: Lỗi DB/nội bộ; `detail` = thông điệp lỗi nguyên văn (ISSUE-93).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorVm" }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, const: UP }
        components:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, const: UP }
      example: { status: UP, components: { db: { status: UP } } }
    ErrorVm:
      type: object
      description: '`response.ErrorVm` (`services/shared/response/response.go:6-10`).'
      required: [statusCode, title, detail]
      properties:
        statusCode: { type: string, enum: ["400", "404", "500"], description: Mã HTTP dạng chuỗi. }
        title: { type: string, enum: [Bad request, Not found, Internal server error] }
        detail: { type: string }
    CategoryDto:
      type: object
      description: '`model.CategoryDto` (`internal/model/product.go:3-8`). Không có field nào bắt buộc ở server.'
      properties:
        categoryId: { type: integer, description: Bị bỏ qua khi tạo; trả về id thật. }
        categoryTitle: { type: string }
        imageUrl: { type: string, description: 'Rỗng khi NULL.' }
        parentCategory:
          $ref: "#/components/schemas/CategoryDto"
          description: 'Request: chỉ đọc `parentCategory.categoryId` (> 0). Response: không bao giờ có khi đọc từ DB.'
    ProductDto:
      type: object
      description: '`model.ProductDto` (`internal/model/product.go:10-18`).'
      properties:
        productId: { type: integer }
        productTitle: { type: string }
        imageUrl: { type: string }
        sku: { type: string, description: 'Không gửi → `""` (UNIQUE — ISSUE-55).' }
        priceUnit: { type: number, format: double, description: 'float64 / DECIMAL(12,2) (ISSUE-27).' }
        quantity: { type: integer }
        category:
          $ref: "#/components/schemas/CategoryDto"
          description: 'Response: có khi sản phẩm có danh mục (chỉ `categoryId`, `categoryTitle`, `imageUrl`). Request: chỉ đọc `category.categoryId`.'
    FavouriteID:
      type: object
      description: '`model.FavouriteID` (`internal/model/favourite.go:3-7`).'
      properties:
        userId: { type: integer }
        productId: { type: integer }
        likeDate: { type: string, example: "2026-01-01T10:00:00" }
    FavouriteDto:
      type: object
      description: '`model.FavouriteDto` (`internal/model/favourite.go:9-15`). Response luôn format `likeDate` = `2006-01-02T15:04:05` (mất múi giờ).'
      properties:
        userId: { type: integer }
        productId: { type: integer }
        likeDate: { type: string, example: "2026-01-01T10:00:00" }
        user: { description: 'interface{} — echo nếu client gửi; không bao giờ điền từ DB.' }
        product: { description: 'interface{} — echo nếu client gửi; không bao giờ điền từ DB.' }
    FavouriteCollectionResponse:
      type: object
      properties:
        collection:
          type: array
          items: { $ref: "#/components/schemas/FavouriteDto" }
