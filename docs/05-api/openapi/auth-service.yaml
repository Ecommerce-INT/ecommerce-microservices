openapi: 3.1.0
info:
  title: auth-service API
  version: "1.0.0"
  description: |
    Đặc tả OpenAPI **as-is** của `auth-service` (Go, chi, port `8088`) — mô tả đúng hành vi code hiện tại,
    không phải thiết kế đích. Service lo: đăng ký user (Keycloak + DB `authservice`), luồng SSO
    (login → callback → ticket → session), làm mới/đăng xuất token, CRUD hồ sơ user và gán role (chỉ DB).

    - Tài liệu service: [../../03-services/auth-service.md](../../03-services/auth-service.md)
    - Định tuyến gateway: [../gateway-routing.md](../gateway-routing.md) · Danh mục API: [../api-catalog.md](../api-catalog.md)

    **Quy ước trong spec này**
    - Path được ghi theo **path tại gateway APISIX** (`http://localhost:9080`). `x-upstream-path` là path service thực sự
      nhận sau `proxy-rewrite` (`^/(.*)` → `/auth/$1`); `x-gateway-route` là `id` route trong `deploy/apisix/apisix.yaml`.
    - Service đăng ký mọi route ở **hai prefix** `/api/v1/...` và `/auth/api/v1/...` (`services/auth-service/internal/handler/auth_handler.go:45-57`),
      nên path gateway cũng gọi trực tiếp được trên `http://localhost:8088`.
    - Mọi response (trừ 302 và health) dùng envelope `ApiResponse` (`services/shared/response/api_response.go:12-21`).
      `data` có `omitempty`: không có khi handler chỉ trả message hoặc khi slice rỗng/nil.
    - `bearerAuth` = APISIX `openid-connect` (`bearer_only`, `use_jwks`, RS256) — **chỉ xác thực, không kiểm role** (ISSUE-01).
      Service tự nó **không** verify JWT (middleware `UserClaims` parse không verify — ISSUE-02).
    - Mọi route chịu global rule `limit-count` (1200 req/60s theo `remote_addr`, vượt → 429 do APISIX trả — ISSUE-61).
  x-source:
    - services/auth-service/main.go
    - services/auth-service/internal/handler/auth_handler.go
    - services/auth-service/internal/model/user.go
    - services/shared/response/api_response.go
    - deploy/apisix/apisix.yaml
servers:
  - url: http://localhost:9080
    description: APISIX gateway (docker compose local). Path trong spec là path tại gateway.
  - url: http://localhost:8088
    description: |
      Gọi trực tiếp auth-service (port publish ra host). Bỏ qua APISIX → không có kiểm tra token nào (ISSUE-02).
      Path gateway vẫn hợp lệ vì service đăng ký cả `/api/v1/...` lẫn `/auth/api/v1/...`.
tags:
  - name: auth
    description: Đăng ký, SSO, ticket/session, refresh, logout (public tại gateway — route `auth-public`).
  - name: users
    description: Hồ sơ user (Bearer — route `auth-users`).
  - name: roles
    description: Gán / thu hồi / liệt kê role trong DB `authservice` (Bearer — route `auth-roles`).
  - name: health
    description: Health check tĩnh, không có route gateway.

paths:
  /actuator/health:
    servers:
      - url: http://localhost:8088
        description: Chỉ gọi trực tiếp — không có route gateway.
    get:
      operationId: authHealth
      tags: [health]
      summary: Health check (luôn UP)
      description: |
        Trả payload tĩnh `{"status":"UP","components":{"db":{"status":"UP"}}}`, kể cả khi DB không kết nối (ISSUE-36).
        Alias cùng handler: `/auth/actuator/health`, `/health` (`auth_handler.go:40-42`).
      x-upstream-path: [/actuator/health, /auth/actuator/health, /health]
      x-gateway-route: none — not exposed
      x-known-issues: [ISSUE-36]
      security: []
      responses:
        "200":
          description: Luôn UP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Đăng ký user (Keycloak + DB)
      description: |
        Kiểm trùng username → email → phone (nếu có) trong DB, tạo user trên Keycloak (Admin API) rồi lưu DB kèm `roles`
        (mặc định `["USER"]`). Không có UI gọi endpoint này (ISSUE-71).
        - `roles` do client gửi được ghi thẳng vào `user_role` → tự gán `ADMIN` (ISSUE-53).
        - Keycloak không truy cập được → id giả `kc-<username>`; `roles` không đẩy sang Keycloak (ISSUE-08).
        - `phone` rỗng được lưu `''` vào cột UNIQUE (ISSUE-55).
        Nguồn: `auth_handler.go:100-123`, `internal/service/user_service.go:34-88`.
      x-upstream-path: /auth/api/v1/auth/signup
      x-gateway-route: auth-public
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-53, ISSUE-08, ISSUE-55, ISSUE-71]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: 'Đăng ký thành công. `message` = "User <username> registered successfully", không có `data`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessageResponse" }
        "400":
          description: |
            - `BAD_REQUEST` "Invalid request body" — body không phải JSON hợp lệ.
            - `VALIDATION_FAILED` "Username, password and email are required".
            - `REGISTRATION_FAILED` — lỗi khác (Keycloak ≥ 400, lỗi DB, `db not connected`…); lỗi DB cũng ra 400 thay vì 500.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "409":
          description: '`CONFLICT` — trùng username / email / phone; `message` dạng "username already exists: nva".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/auth/login:
    get:
      operationId: ssoLogin
      tags: [auth]
      summary: Bắt đầu SSO — 302 sang trang authorize của Keycloak
      description: |
        Tạo `state` ngẫu nhiên (lưu **trong bộ nhớ** 5 phút — ISSUE-06) gắn với `redirect_uri`, rồi 302 tới
        `{KEYCLOAK_PUBLIC_SERVER_URL}/realms/{realm}/protocol/openid-connect/auth?client_id&response_type=code&scope&redirect_uri={SSO_BACKEND_CALLBACK_URL}&state`.
        `redirect_uri` **không được kiểm allowlist** (ISSUE-05; biến `SSO_ALLOWED_REDIRECT_URIS` không được đọc).
        Nguồn: `auth_handler.go:125-134`, `internal/service/keycloak_client.go:101-109`.
      x-upstream-path: /auth/api/v1/auth/login
      x-gateway-route: auth-public
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-05, ISSUE-06]
      security: []
      parameters:
        - name: redirect_uri
          in: query
          required: false
          description: URL frontend sẽ nhận `?ticket=`. Trống → `SSO_DEFAULT_FRONTEND_REDIRECT`.
          schema: { type: string, format: uri }
      responses:
        "302":
          description: Chuyển hướng tới Keycloak authorize endpoint. Không có mã lỗi.
          headers:
            Location:
              schema: { type: string, format: uri }

  /api/v1/auth/callback:
    get:
      operationId: ssoCallback
      tags: [auth]
      summary: Callback OIDC — đổi code lấy token, 302 về frontend kèm ticket
      description: |
        - Có `error` → 302 `SSO_DEFAULT_FRONTEND_REDIRECT?error=<error>` (luôn về default).
        - `state` không tồn tại/hết hạn → **vẫn tiếp tục** với redirect mặc định (ISSUE-52).
        - Đổi code dùng `redirect_uri = frontendRedirect` khác với lúc authorize (`SSO_BACKEND_CALLBACK_URL`) → Keycloak từ chối;
          khi đổi code lỗi handler lưu **mock token** (`mock-access-token`, `mock-refresh-token`, `expires_in` 3600) và vẫn cấp ticket (ISSUE-04).
        - Ticket lưu trong bộ nhớ 2 phút (ISSUE-06).
        Nguồn: `auth_handler.go:136-167`.
      x-upstream-path: /auth/api/v1/auth/callback
      x-gateway-route: auth-public
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-04, ISSUE-52, ISSUE-06]
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: 'Về `<frontendRedirect>?ticket=<random>` hoặc `<SSO_DEFAULT_FRONTEND_REDIRECT>?error=<error>`.'
          headers:
            Location:
              schema: { type: string, format: uri }

  /api/v1/auth/session:
    get:
      operationId: ssoSession
      tags: [auth]
      summary: Đổi ticket (dùng 1 lần) lấy token
      description: 'Nguồn: `auth_handler.go:169-183`. Ticket tiêu thụ một lần, hết hạn sau 2 phút (store trong bộ nhớ — ISSUE-06).'
      x-upstream-path: /auth/api/v1/auth/session
      x-gateway-route: auth-public
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-06, ISSUE-04]
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Token Keycloak (hoặc mock token nếu callback đổi code thất bại — ISSUE-04).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenResponse" }
        "400":
          description: '`BAD_REQUEST` "Ticket is required".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401":
          description: '`UNAUTHORIZED` "Invalid or expired ticket" — ticket không tồn tại, đã dùng hoặc quá 2 phút.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Làm mới token bằng refresh token
      description: 'Gọi Keycloak `grant_type=refresh_token`. Nguồn: `auth_handler.go:185-199`.'
      x-upstream-path: /auth/api/v1/auth/refresh
      x-gateway-route: auth-public
      x-required-role: none (ISSUE-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Token mới.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenResponse" }
        "400":
          description: '`BAD_REQUEST` "Refresh token is required" — body lỗi hoặc `refreshToken` rỗng.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401":
          description: '`UNAUTHORIZED`; `message` = lỗi Keycloak nguyên văn (vd `keycloak token error: {"error":"invalid_grant",…} (status 400)`).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Đăng xuất Keycloak (luôn 200)
      description: 'Body tùy chọn; nếu có `refreshToken` thì gọi Keycloak logout, **mọi lỗi bị bỏ qua**. Nguồn: `auth_handler.go:201-208`.'
      x-upstream-path: /auth/api/v1/auth/logout
      x-gateway-route: auth-public
      x-required-role: none (ISSUE-01)
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: '`message` = "Logout successful".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessageResponse" }

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Hồ sơ user hiện tại
      description: |
        Lấy `preferred_username` (fallback `sub`) từ JWT (parse **không verify** — ISSUE-02) rồi tìm `users.user_name`.
        `UserResponse` **không có `roles`** và dùng key `fullname` chữ thường (ISSUE-100). User chỉ có trong Keycloak → 404 (ISSUE-101).
        Nguồn: `auth_handler.go:318-339`.
      x-upstream-path: /auth/api/v1/users/me
      x-gateway-route: auth-users
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-100, ISSUE-101, ISSUE-02, ISSUE-01]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hồ sơ user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiUserResponse" }
        "401":
          description: |
            - Tại gateway: APISIX từ chối token thiếu/sai (body do APISIX sinh, không phải envelope).
            - Tại service (gọi trực tiếp): `AUTH_TOKEN_INVALID` "Invalid or missing token" khi không có/không parse được JWT hoặc thiếu cả `preferred_username` lẫn `sub`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "404":
          description: '`NOT_FOUND` "User not found" — username không có trong DB `authservice` (ISSUE-101).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "500":
          description: '`INTERNAL_ERROR` — lỗi DB / "db not connected"; `message` = lỗi nội bộ nguyên văn (ISSUE-93).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/users/me/password:
    put:
      operationId: changePassword
      tags: [users]
      summary: Đổi mật khẩu — STUB, luôn 200
      description: 'Body (`ChangePasswordRequest`) **không được đọc**; không đổi gì cả (ISSUE-07). Nguồn: `auth_handler.go:240-242`.'
      x-upstream-path: /auth/api/v1/users/me/password
      x-gateway-route: auth-users
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-07, ISSUE-01]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        description: Bị bỏ qua.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: '`message` = "Password change request processed".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessageResponse" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }

  /api/v1/users/all:
    get:
      operationId: listUsersPaged
      tags: [users]
      summary: Danh sách user phân trang
      description: |
        Tham số không phải số → 0 rồi áp default; `page < 0` → 0; `size <= 0` → 10.
        `sortBy` ∈ `username|user_name` → `user_name`, `email`, `fullname|full_name` → `full_name`, khác → `user_id`.
        `sortOrder` = `DESC` (không phân biệt hoa thường) → DESC, khác → ASC.
        Khi không có user, `content` là `null` (slice nil). Nguồn: `auth_handler.go:303-316`, `internal/repository/user_repository.go:167-215`.
      x-upstream-path: /auth/api/v1/users/all
      x-gateway-route: auth-users
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-01, ISSUE-93]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
        - name: sortBy
          in: query
          schema:
            type: string
            default: id
            description: 'username | user_name | email | fullname | full_name; giá trị khác (kể cả mặc định `id`) → `user_id`.'
        - name: sortOrder
          in: query
          schema: { type: string, default: ASC, enum: [ASC, DESC, asc, desc] }
      responses:
        "200":
          description: Trang user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiUserPageResponse" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "500":
          description: '`INTERNAL_ERROR` — lỗi DB / "db not connected".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: '`users.user_id` (parse `strconv.ParseInt` 64-bit).'
        schema: { type: integer, format: int64 }
    get:
      operationId: getUserById
      tags: [users]
      summary: Lấy user theo id
      description: 'Nguồn: `auth_handler.go:283-301`.'
      x-upstream-path: /auth/api/v1/users/{id}
      x-gateway-route: auth-users
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-01, ISSUE-100]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiUserResponse" }
        "400":
          description: '`INVALID_ID` "User ID must be numeric".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "404":
          description: '`NOT_FOUND` "User not found".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "500":
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    put:
      operationId: updateUser
      tags: [users]
      summary: Cập nhật một phần hồ sơ user
      description: |
        Field vắng mặt giữ nguyên. Không đồng bộ sang Keycloak. Vi phạm UNIQUE email/phone → **500** (không map 409); phone rỗng ghi `''` (ISSUE-55).
        Nguồn: `auth_handler.go:214-238`, `internal/repository/user_repository.go:272-317`.
      x-upstream-path: /auth/api/v1/users/{id}
      x-gateway-route: auth-users
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-01, ISSUE-55, ISSUE-93]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: '`message` = "User updated successfully", `data` = user sau cập nhật.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiUserResponse" }
        "400":
          description: '`INVALID_ID` "User ID must be numeric" hoặc `BAD_REQUEST` "Invalid request body".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "404":
          description: '`NOT_FOUND` "User not found".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "500":
          description: '`INTERNAL_ERROR` — lỗi DB (gồm vi phạm UNIQUE).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Xóa user (Keycloak + DB)
      description: 'Xóa user Keycloak trước (lỗi bị bỏ qua) rồi xóa DB. Nguồn: `auth_handler.go:244-261`, `user_service.go:101-115`.'
      x-upstream-path: /auth/api/v1/users/{id}
      x-gateway-route: auth-users
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-01]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: '`message` = "User <id> deleted successfully".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessageResponse" }
        "400":
          description: '`INVALID_ID`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "404":
          description: '`NOT_FOUND` "User not found".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "500":
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/users:
    get:
      operationId: getUserByUsername
      tags: [users]
      summary: Tìm user theo username
      description: 'Nguồn: `auth_handler.go:263-281`.'
      x-upstream-path: /auth/api/v1/users
      x-gateway-route: auth-users
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-01]
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiUserResponse" }
        "400":
          description: '`BAD_REQUEST` "username query parameter is required".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "404":
          description: '`NOT_FOUND` "User not found".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "500":
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/roles/users/{userId}/assign:
    parameters:
      - $ref: "#/components/parameters/UserIdPath"
    post:
      operationId: assignRole
      tags: [roles]
      summary: Gán role cho user (chỉ DB)
      description: |
        Body là **text thuần** = tên role (vd `ADMIN`); service `TrimSpace` + `ToUpper`. `INSERT … SELECT FROM roles … ON CONFLICT DO NOTHING`.
        Không đồng bộ Keycloak (ISSUE-08). Nguồn: `auth_handler.go:345-370`, `internal/repository/user_repository.go:331-354`.
      x-upstream-path: /auth/api/v1/roles/users/{userId}/assign
      x-gateway-route: auth-roles
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-01, ISSUE-08]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, example: ADMIN }
      responses:
        "200":
          description: '`message` = "Roles assigned to user <userId>".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessageResponse" }
        "400":
          description: '`INVALID_ID` "User ID must be numeric" hoặc `BAD_REQUEST` "Role name cannot be empty".'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/GatewayUnauthorized" }
        "409":
          description: '`CONFLICT` "Role already assigned or user/role not found" — 0 dòng được insert (role đã gán hoặc tên role không tồn tại).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "500":
          description: '`INTERNAL_ERROR` — lỗi DB, vd `userId` không tồn tại → vi phạm FK.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/roles/users/{userId}/revoke:
