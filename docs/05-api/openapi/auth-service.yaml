              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak (realm `ecommerce`). APISIX plugin `openid-connect` (`bearer_only: true`, `use_jwks: true`, RS256)
        verify chữ ký/hạn; **không kiểm role/scope** (ISSUE-01). Service không tự verify (ISSUE-02).
  parameters:
    UserIdPath:
      name: userId
      in: path
      required: true
      description: '`users.user_id` (parse int64).'
      schema: { type: integer, format: int64 }
  responses:
    GatewayUnauthorized:
      description: |
        APISIX `openid-connect` từ chối: thiếu header `Authorization: Bearer`, chữ ký sai hoặc token hết hạn.
        Body/headers do APISIX sinh (không phải `ApiResponse`). Gọi trực tiếp service sẽ không bao giờ nhận mã này cho endpoint này.
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, const: UP }
        components:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, const: UP }
      example: { status: UP, components: { db: { status: UP } } }
    ApiResponseBase:
      type: object
      description: '`ApiResponse[T]` — `services/shared/response/api_response.go:12-21`.'
      required: [success, timestamp]
      properties:
        success: { type: boolean }
        code: { type: string, description: '"OK" khi thành công; mã lỗi khi thất bại.' }
        message: { type: string }
        errors:
          type: array
          items: { type: string }
          description: Không handler nào truyền → luôn vắng mặt.
        path: { type: string, description: 'Chỉ có ở lỗi; là `r.URL.Path` tại service (qua gateway là path đã rewrite, vd `/auth/api/v1/users/5`).' }
        traceId: { type: string, description: 'Giá trị header `X-Correlation-Id` (nhận hoặc tự sinh 32 hex).' }
        timestamp: { type: string, format: date-time }
    ApiMessageResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            success: { const: true }
            code: { const: OK }
      example: { success: true, code: OK, message: "Logout successful", traceId: "3f2a…", timestamp: "2026-11-12T03:15:20Z" }
    ApiErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          required: [code, path]
          properties:
            success: { const: false }
            code:
              type: string
              enum: [BAD_REQUEST, VALIDATION_FAILED, REGISTRATION_FAILED, CONFLICT, UNAUTHORIZED, AUTH_TOKEN_INVALID, INVALID_ID, NOT_FOUND, INTERNAL_ERROR]
      example: { success: false, code: NOT_FOUND, message: "User not found", path: "/auth/api/v1/users/99", traceId: "3f2a…", timestamp: "2026-11-12T03:15:20Z" }
    ApiTokenResponse:
      allOf:
        - $ref: "#/components/schemas/ApiMessageResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/KeycloakTokenResponse" }
    ApiUserResponse:
      allOf:
        - $ref: "#/components/schemas/ApiMessageResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UserResponse" }
    ApiUserPageResponse:
      allOf:
        - $ref: "#/components/schemas/ApiMessageResponse"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UserPage" }
    ApiRolesResponse:
      allOf:
        - $ref: "#/components/schemas/ApiMessageResponse"
        - type: object
          properties:
            data:
              type: array
              items: { type: string }
              example: [USER, ADMIN]
    UserResponse:
      type: object
      description: '`model.UserResponse` (`internal/model/user.go:15-23`). **Không có `roles`**; key `fullname` chữ thường (ISSUE-100).'
      properties:
        id: { type: integer, format: int64 }
        fullname: { type: string }
        username: { type: string }
        email: { type: string }
        gender: { type: string }
        phone: { type: string }
        avatar: { type: string }
    UserPage:
      type: object
      description: '`model.PageResponse[UserResponse]` (`internal/model/user.go:63-73`).'
      properties:
        content:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/UserResponse" }
          description: '`null` khi không có phần tử.'
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }
        numberOfElements: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
    RegisterRequest:
      type: object
      description: '`model.RegisterRequest` (`internal/model/user.go:25-34`). Handler chỉ kiểm `username`, `password`, `email` khác rỗng.'
      required: [username, password, email]
      properties:
        fullName: { type: string }
        username: { type: string }
        password: { type: string, format: password }
        email: { type: string, description: Không validate định dạng. }
        gender: { type: string }
        phone: { type: string }
        avatar: { type: string }
        roles:
          type: array
          items: { type: string }
          description: 'Mặc định `["USER"]`. Client tự chọn được role bất kỳ (ISSUE-53).'
    UpdateUserRequest:
      type: object
      description: '`model.UpdateUserRequest` — mọi field con trỏ, vắng mặt = giữ nguyên.'
      properties:
        fullName: { type: string }
        email: { type: string }
        gender: { type: string }
        phone: { type: string }
        avatar: { type: string }
    ChangePasswordRequest:
      type: object
      description: Khai báo trong model nhưng handler không đọc (ISSUE-07).
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password }
        confirmPassword: { type: string, format: password }
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken: { type: string }
    KeycloakTokenResponse:
      type: object
      description: '`model.KeycloakTokenResponse` (`internal/model/user.go:54-61`).'
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, format: int64 }
        refresh_expires_in: { type: integer, format: int64 }
        scope: { type: string }
