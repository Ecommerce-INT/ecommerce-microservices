openapi: 3.1.0
info:
  title: search-service API
  version: "1.0.0"
  description: |
    Đặc tả OpenAPI **as-is** của `search-service` (Go, chi, port `8094`) — tìm kiếm full-text và gợi ý tên sản phẩm trên
    OpenSearch index `product`. Mô tả đúng hành vi code hiện tại, không phải thiết kế đích.

    - Tài liệu service: [../../03-services/search-service.md](../../03-services/search-service.md)
    - Định tuyến gateway: [../gateway-routing.md](../gateway-routing.md) · Danh mục API: [../api-catalog.md](../api-catalog.md)

    **Quy ước trong spec này**
    - Path ghi theo **path tại gateway APISIX**; `x-upstream-path` là path sau `proxy-rewrite` (`^/(.*)` → `/search/$1`).
      Service đăng ký ở prefix `/search` và gốc (`services/search-service/internal/handler/search_handler.go:25-27`).
    - Thành công: **JSON thô**; lỗi: `ErrorVm` (chỉ 500, thực tế gần như không xảy ra).
    - Route `search-storefront` **public**.
    - Index luôn rỗng vì không có nguồn đồng bộ (consumer Debezium không có connector — ISSUE-19). Lỗi OpenSearch bị che bằng trang rỗng (ISSUE-34).
      Storefront không gọi service này (ISSUE-78).
    - Mọi route chịu `limit-count` global của APISIX (429 — ISSUE-61).
  x-source:
    - services/search-service/internal/handler/search_handler.go
    - services/search-service/internal/model/search.go
    - services/search-service/internal/service/search_service.go
    - deploy/apisix/apisix.yaml
servers:
  - url: http://localhost:9080
    description: APISIX gateway (docker compose local). Path trong spec là path tại gateway.
  - url: http://localhost:8094
    description: Gọi trực tiếp search-service (port publish ra host — ISSUE-02). Path gateway vẫn hợp lệ.
tags:
  - name: search
    description: Tìm kiếm & gợi ý (route `search-storefront`, public).
  - name: health
    description: Health check tĩnh, không có route gateway.

paths:
  /actuator/health:
    servers:
      - url: http://localhost:8094
        description: Chỉ gọi trực tiếp — không có route gateway.
    get:
      operationId: searchHealth
      tags: [health]
      summary: Health check (luôn UP)
      description: 'Payload tĩnh `{"status":"UP","components":{"opensearch":{"status":"UP"}}}` kể cả khi OpenSearch chết (ISSUE-36). Alias: `/search/actuator/health`.'
      x-upstream-path: [/actuator/health, /search/actuator/health]
      x-gateway-route: none — not exposed
      x-known-issues: [ISSUE-36]
      security: []
      responses:
        "200":
          description: Luôn UP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /storefront/catalog-search:
    get:
      operationId: catalogSearch
      tags: [search]
      summary: Tìm kiếm sản phẩm nâng cao
      description: |
        Query OpenSearch: keyword → `multi_match` (`name^3`, `brand^2`, `categories`, fuzziness AUTO) trong `bool.should`;
        `brand` → `term brand.keyword`; `category` → `term categories`; `attribute` → `term attributes`; `minPrice/maxPrice` → `range price`
        (tất cả trong `bool.must`). Khi có filter, keyword không còn lọc; `term` trên field text dynamic không khớp (ISSUE-58).
        `sortType` **bị bỏ qua**; `aggregations` luôn `{}` (ISSUE-34). `createdOn` **không bao giờ được điền**.
        Lỗi OpenSearch (index chưa có, mất kết nối) hoặc client nil → **200** trang rỗng `isLast: true` (ISSUE-34).
        `page`/`size` âm không bị chặn (OpenSearch lỗi → trang rỗng).
        Nguồn: `search_handler.go:50-84`, `internal/service/search_service.go:24-192`.
      x-upstream-path: /search/storefront/catalog-search
      x-gateway-route: search-storefront
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-34, ISSUE-19, ISSUE-58, ISSUE-78]
      security: []
      parameters:
        - name: keyword
          in: query
          schema: { type: string, default: "" }
        - name: page
          in: query
          description: 'Không phải số → 0.'
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          description: 'Không phải số → 12. Không chặn giá trị lớn/âm.'
          schema: { type: integer, default: 12 }
        - name: brand
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: attribute
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          description: 'Không parse được → bỏ qua.'
          schema: { type: number, format: double }
        - name: maxPrice
          in: query
          description: 'Không parse được → bỏ qua.'
          schema: { type: number, format: double }
        - name: sortType
          in: query
          description: 'Bị bỏ qua (ISSUE-34).'
          schema: { type: string, default: DEFAULT }
      responses:
        "200":
          description: Trang kết quả (rỗng khi lỗi OpenSearch).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListGetVm" }
        "500":
          description: Chỉ khi encode body query lỗi (thực tế không xảy ra).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorVm" }

  /storefront/search_suggest:
    get:
      operationId: searchSuggest
      tags: [search]
      summary: Gợi ý tên sản phẩm (autocomplete)
      description: |
        `match_phrase_prefix` trên `name`, tối đa 10 kết quả. `keyword` rỗng/khoảng trắng, client OpenSearch nil hoặc lỗi OpenSearch
        → `{"productNames": []}` với 200. Nguồn: `search_handler.go:86-94`, `internal/service/search_service.go:194-238`.
      x-upstream-path: /search/storefront/search_suggest
      x-gateway-route: search-storefront
      x-required-role: none (ISSUE-01)
      x-known-issues: [ISSUE-19, ISSUE-78]
      security: []
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Danh sách gợi ý.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductNameListVm" }
        "500":
          description: Chỉ khi encode body query lỗi (thực tế không xảy ra).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorVm" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Khai báo cho đồng bộ với các spec khác — mọi route của search-service đều public tại gateway.
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, const: UP }
        components:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, const: UP }
      example: { status: UP, components: { opensearch: { status: UP } } }
    ErrorVm:
      type: object
      description: '`response.ErrorVm` (`services/shared/response/response.go:6-10`).'
      required: [statusCode, title, detail]
      properties:
        statusCode: { type: string, enum: ["500"] }
        title: { type: string, enum: [Internal server error] }
        detail: { type: string }
    ProductGetVm:
      type: object
      description: '`model.ProductGetVm` (`internal/model/search.go:21-32`), đọc thủ công từ `_source`; field thiếu → zero value.'
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        thumbnailId: { type: integer, format: int64, description: 'Chỉ có khi document có `thumbnailMediaId`.' }
        price: { type: number, format: double }
        isAllowedToOrder: { type: boolean }
        isPublished: { type: boolean }
        isFeatured: { type: boolean }
        isVisibleIndividually: { type: boolean }
        createdOn: { type: string, format: date-time, description: 'Khai báo trong struct nhưng **không bao giờ được điền** → luôn vắng mặt.' }
    ProductListGetVm:
      type: object
      description: '`model.ProductListGetVm` (`internal/model/search.go:34-42`). `isLast` = `page + 1 >= totalPages`.'
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/ProductGetVm" }
        pageNo: { type: integer }
        pageSize: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        isLast: { type: boolean }
        aggregations:
          type: object
          description: 'Luôn `{}` (ISSUE-34).'
          additionalProperties:
            type: object
            additionalProperties: { type: integer }
      example: { products: [], pageNo: 0, pageSize: 12, totalElements: 0, totalPages: 0, isLast: true, aggregations: {} }
    ProductNameGetVm:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    ProductNameListVm:
      type: object
      properties:
        productNames:
          type: array
          items: { $ref: "#/components/schemas/ProductNameGetVm" }
